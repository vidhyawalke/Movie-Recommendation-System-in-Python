<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="40%" stop-color="#180a14" />
      <stop offset="75%" stop-color="#240c18" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="50%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c518" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <linearGradient id="beamGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffdf73" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffdf73" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Film Sprocket Pattern -->
    <pattern id="sprocketTop" x="0" y="0" width="40" height="26" patternUnits="userSpaceOnUse">
      <rect x="8" y="5" width="24" height="16" rx="3" fill="#ffffff" fill-opacity="0.15" />
    </pattern>
    <pattern id="sprocketBottom" x="0" y="0" width="40" height="26" patternUnits="userSpaceOnUse">
      <rect x="8" y="5" width="24" height="16" rx="3" fill="#ffffff" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; letter-spacing: 4px; font-weight: 700; fill: #f5c518; text-transform: uppercase; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 46px; font-weight: 900; letter-spacing: -0.5px; fill: #ffffff; }
    .title-tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #c9d1d9; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .badge-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="14" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Film Strip Track -->
  <rect x="0" y="0" width="1200" height="26" rx="14" fill="#000000" fill-opacity="0.6" />
  <rect x="0" y="0" width="1200" height="26" fill="url(#sprocketTop)" />
  <line x1="0" y1="26" x2="1200" y2="26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Bottom Film Strip Track -->
  <rect x="0" y="374" width="1200" height="26" rx="14" fill="#000000" fill-opacity="0.6" />
  <rect x="0" y="374" width="1200" height="26" fill="url(#sprocketBottom)" />
  <line x1="0" y1="374" x2="1200" y2="374" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Background Cinema Projector Beam Effect -->
  <polygon points="120,205 600,100 600,310" fill="url(#beamGradient)" />

  <!-- Vintage Cinema Projector Graphic (Left) -->
  <g transform="translate(45, 125)">
    <!-- Projector Reels -->
    <circle cx="55" cy="50" r="32" fill="#161b22" stroke="#e50914" stroke-width="3.5" filter="url(#softGlow)" />
    <circle cx="55" cy="50" r="12" fill="#21262d" stroke="#f5c518" stroke-width="2" />
    <line x1="55" y1="22" x2="55" y2="78" stroke="#8b949e" stroke-width="2" />
    <line x1="27" y1="50" x2="83" y2="50" stroke="#8b949e" stroke-width="2" />
    <line x1="35" y1="30" x2="75" y2="70" stroke="#8b949e" stroke-width="2" />
    <line x1="35" y1="70" x2="75" y2="30" stroke="#8b949e" stroke-width="2" />

    <circle cx="115" cy="40" r="26" fill="#161b22" stroke="#e50914" stroke-width="3" filter="url(#softGlow)" />
    <circle cx="115" cy="40" r="9" fill="#21262d" stroke="#f5c518" stroke-width="1.8" />
    <line x1="115" y1="16" x2="115" y2="64" stroke="#8b949e" stroke-width="1.8" />
    <line x1="91" y1="40" x2="139" y2="40" stroke="#8b949e" stroke-width="1.8" />

    <!-- Projector Body -->
    <rect x="40" y="80" width="85" height="58" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="48" y="90" width="26" height="20" rx="3" fill="#e50914" fill-opacity="0.3" stroke="#e50914" stroke-width="1" />
    <circle cx="102" cy="100" r="6" fill="#f5c518" />
    <circle cx="102" cy="120" r="4" fill="#388bfd" />

    <!-- Lens Assembly -->
    <polygon points="125,92 155,80 155,126 125,114" fill="#21262d" stroke="#f5c518" stroke-width="2" />
    <ellipse cx="155" cy="103" rx="5" ry="23" fill="#ffdf73" filter="url(#glow)" />

    <!-- Tripod / Stand Base -->
    <line x1="82" y1="138" x2="82" y2="185" stroke="#484f58" stroke-width="5" stroke-linecap="round" />
    <line x1="82" y1="165" x2="45" y2="205" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    <line x1="82" y1="165" x2="120" y2="205" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Center Content Area -->
  <g transform="translate(245, 75)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#e50914" fill-opacity="0.2" stroke="#e50914" stroke-width="1" />
    <text x="16" y="17" class="title-sub" fill="#ff6b6b">MACHINE LEARNING</text>

    <!-- Main Title -->
    <text x="0" y="65" class="title-main">Movie Recommendation System</text>
    <text x="0" y="105" class="title-tagline">Real-time content matching and collaborative filtering on 25 million ratings</text>

    <!-- Value Cards / Feature Highlights -->
    <g transform="translate(0, 135)">
      <!-- Card 1: Corpus Size -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="205" height="72" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
        <circle cx="28" cy="36" r="16" fill="#e50914" fill-opacity="0.2" />
        <text x="28" y="42" text-anchor="middle" font-size="16" fill="#ff6b6b">&#127916;</text>
        <text x="56" y="32" class="badge-text">62,423 Movies</text>
        <text x="56" y="52" class="badge-sub">Full MovieLens 25M catalog</text>
      </g>

      <!-- Card 2: Ratings Scale -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="215" height="72" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
        <circle cx="28" cy="36" r="16" fill="#f5c518" fill-opacity="0.2" />
        <text x="28" y="42" text-anchor="middle" font-size="16" fill="#f5c518">&#9733;</text>
        <text x="56" y="32" class="badge-text">25M User Ratings</text>
        <text x="56" y="52" class="badge-sub">162,541 user preference profiles</text>
      </g>

      <!-- Card 3: Dual Engine -->
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="225" height="72" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
        <circle cx="28" cy="36" r="16" fill="#388bfd" fill-opacity="0.2" />
        <text x="28" y="42" text-anchor="middle" font-size="16" fill="#58a6ff">&#9881;</text>
        <text x="56" y="32" class="badge-text">TF-IDF + Cosine Sim</text>
        <text x="56" y="52" class="badge-sub">N-gram title search + CF scoring</text>
      </g>

      <!-- Card 4: Interactive UI -->
      <g transform="translate(690, 0)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
        <circle cx="28" cy="36" r="16" fill="#3fb950" fill-opacity="0.2" />
        <text x="28" y="42" text-anchor="middle" font-size="16" fill="#3fb950">&#9889;</text>
        <text x="56" y="32" class="badge-text">Interactive UI</text>
        <text x="56" y="52" class="badge-sub">Live search with ipywidgets</text>
      </g>
    </g>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 230)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#8b949e">CORE STACK</text>
      
      <!-- Python Pill -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="85" height="24" rx="12" fill="#1f242c" stroke="#388bfd" stroke-width="1" />
        <text x="42" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">Python 3.11</text>
      </g>

      <!-- scikit-learn Pill -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="95" height="24" rx="12" fill="#1f242c" stroke="#f0883e" stroke-width="1" />
        <text x="47" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#f0883e">scikit-learn</text>
      </g>

      <!-- pandas Pill -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="75" height="24" rx="12" fill="#1f242c" stroke="#d2a8ff" stroke-width="1" />
        <text x="37" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#d2a8ff">pandas</text>
      </g>

      <!-- NumPy Pill -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="75" height="24" rx="12" fill="#1f242c" stroke="#79c0ff" stroke-width="1" />
        <text x="37" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#79c0ff">NumPy</text>
      </g>

      <!-- ipywidgets Pill -->
      <g transform="translate(465, 0)">
        <rect x="0" y="0" width="95" height="24" rx="12" fill="#1f242c" stroke="#56d364" stroke-width="1" />
        <text x="47" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#56d364">ipywidgets</text>
      </g>

      <!-- Jupyter Pill -->
      <g transform="translate(570, 0)">
        <rect x="0" y="0" width="80" height="24" rx="12" fill="#1f242c" stroke="#f5c518" stroke-width="1" />
        <text x="40" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#f5c518">Jupyter</text>
      </g>
    </g>
  </g>
</svg>
