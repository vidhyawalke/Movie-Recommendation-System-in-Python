<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="40%" stop-color="#0f1422" />
      <stop offset="75%" stop-color="#180b18" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>

    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#f5c518" />
    </linearGradient>

    <!-- App Window Gradients -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>

    <linearGradient id="searchBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2636" />
      <stop offset="100%" stop-color="#262f42" />
    </linearGradient>

    <!-- Poster Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d54" />
      <stop offset="50%" stop-color="#1d2d59" />
      <stop offset="100%" stop-color="#0d1b33" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#541d24" />
      <stop offset="50%" stop-color="#3b1d42" />
      <stop offset="100%" stop-color="#12182b" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163e47" />
      <stop offset="50%" stop-color="#172b47" />
      <stop offset="100%" stop-color="#0b172b" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c13" />
      <stop offset="50%" stop-color="#3d1720" />
      <stop offset="100%" stop-color="#141421" />
    </linearGradient>

    <linearGradient id="goldScore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c518" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 13px; font-weight: 800; letter-spacing: 3px; fill: #ff4757; text-transform: uppercase; }
    .hero-title-gradient { font-size: 52px; font-weight: 900; letter-spacing: -1px; fill: url(#textRedGrad); }
    .hero-title-white { font-size: 52px; font-weight: 900; letter-spacing: -1px; fill: #ffffff; }
    .hero-sub { font-size: 16px; font-weight: 400; line-height: 1.5; fill: #94a3b8; }
    .app-title { font-size: 13px; font-weight: 600; fill: #94a3b8; }
    .input-text { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .card-title { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .card-genre { font-size: 10px; font-weight: 500; fill: #94a3b8; }
    .score-badge { font-size: 10px; font-weight: 800; fill: #000000; }
    .stat-val { font-size: 18px; font-weight: 800; fill: #ffffff; }
    .stat-label { font-size: 11px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="480" rx="16" fill="url(#mainBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="url(#glowRed)" />
  <circle cx="950" cy="380" r="220" fill="url(#glowBlue)" />

  <!-- Cinematic Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- LEFT COLUMN: Typography & Technical Highlights -->
  <g transform="translate(60, 65)" class="font-sans">
    <!-- Category Pill -->
    <g>
      <rect x="0" y="0" width="225" height="28" rx="14" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#ef4444" />
      <text x="26" y="19" class="kicker">MACHINE LEARNING</text>
    </g>

    <!-- Main Title Lines -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="hero-title-gradient">MOVIE</text>
      <text x="0" y="55" class="hero-title-white">RECOMMENDER</text>
    </g>

    <!-- Subtitle Summary -->
    <text x="0" y="200" class="hero-sub">
      Dual-engine recommendation pipeline combining TF-IDF
    </text>
    <text x="0" y="224" class="hero-sub">
      vector search and collaborative filtering on 25M ratings.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 260)">
      <!-- Metric 1 -->
      <g>
        <text x="0" y="0" class="stat-val">62,423</text>
        <text x="0" y="18" class="stat-label">Movies</text>
      </g>
      <!-- Divider -->
      <line x1="85" y1="-12" x2="85" y2="22" stroke="#334155" stroke-width="1" />
      <!-- Metric 2 -->
      <g transform="translate(105, 0)">
        <text x="0" y="0" class="stat-val">25,000,095</text>
        <text x="0" y="18" class="stat-label">Ratings</text>
      </g>
      <!-- Divider -->
      <line x1="230" y1="-12" x2="230" y2="22" stroke="#334155" stroke-width="1" />
      <!-- Metric 3 -->
      <g transform="translate(250, 0)">
        <text x="0" y="0" class="stat-val" fill="#38bdf8">162,541</text>
        <text x="0" y="18" class="stat-label">Users</text>
      </g>
    </g>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="38" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">Python</text>

      <rect x="84" y="0" width="94" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="131" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">scikit-learn</text>

      <rect x="186" y="0" width="70" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="221" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#a855f7">TF-IDF</text>

      <rect x="264" y="0" width="100" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="314" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">MovieLens 25M</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interactive UI Window Mockup (Like Video / Portfolio Showcase) -->
  <g transform="translate(560, 50)" filter="url(#shadowFilter)" class="font-sans">
    <!-- Window Frame -->
    <rect width="580" height="380" rx="14" fill="url(#windowBg)" stroke="#334155" stroke-width="1.5" />

    <!-- macOS Style Window Header -->
    <rect width="580" height="38" rx="14" fill="#1e2638" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="290" y="24" text-anchor="middle" class="app-title">Movie Recommender • Interactive Engine</text>

    <!-- Search Input Box inside Window -->
    <g transform="translate(25, 55)">
      <rect width="530" height="46" rx="8" fill="url(#searchBarBg)" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Search Magnifier Icon -->
      <g transform="translate(16, 14)" stroke="#60a5fa" stroke-width="2" fill="none">
        <circle cx="6" cy="6" r="6" />
        <line x1="11" y1="11" x2="16" y2="16" stroke-linecap="round" />
      </g>
      <!-- Query Text -->
      <text x="46" y="28" class="input-text">The Avengers (2012)</text>
      <!-- Search Match Badge -->
      <rect x="420" y="10" width="96" height="26" rx="13" fill="#1d4ed8" />
      <text x="468" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Cosine: 1.00</text>
    </g>

    <!-- Section Heading inside Window -->
    <g transform="translate(25, 122)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.3px">Top 4 Personalized Recommendations</text>
      <text x="530" y="0" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Collaborative Score</text>
    </g>

    <!-- Recommendation Cards Grid (4 Movie Cards Side-by-Side) -->
    <g transform="translate(25, 138)">
      <!-- Card 1: Thor: The Dark World -->
      <g transform="translate(0, 0)">
        <rect width="124" height="205" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" />
        <!-- Movie Poster Thumbnail Art Area -->
        <rect x="6" y="6" width="112" height="115" rx="6" fill="#131b2e" />
        <!-- Stylized Movie Icon Inside Art Area -->
        <circle cx="62" cy="55" r="24" fill="#3b82f6" fill-opacity="0.25" />
        <polygon points="56,43 74,55 56,67" fill="#60a5fa" />
        <!-- Score Tag Pill -->
        <rect x="10" y="12" width="48" height="18" rx="9" fill="url(#goldScore)" />
        <text x="34" y="25" text-anchor="middle" class="score-badge">19.6x</text>
        <!-- Card Text Details -->
        <text x="10" y="142" class="card-title">Thor: Dark World</text>
        <text x="10" y="158" class="card-genre">Action • Fantasy</text>
        <text x="10" y="174" font-size="10" font-weight="600" fill="#38bdf8">94% match</text>
        <text x="10" y="194" font-size="9" fill="#64748b">2013 • IMAX</text>
      </g>

      <!-- Card 2: Avengers: Age of Ultron -->
      <g transform="translate(135, 0)">
        <rect width="124" height="205" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
        <rect x="6" y="6" width="112" height="115" rx="6" fill="#24131e" />
        <circle cx="62" cy="55" r="24" fill="#ef4444" fill-opacity="0.25" />
        <polygon points="56,43 74,55 56,67" fill="#f87171" />
        <rect x="10" y="12" width="48" height="18" rx="9" fill="url(#goldScore)" />
        <text x="34" y="25" text-anchor="middle" class="score-badge">19.5x</text>
        <text x="10" y="142" class="card-title">Age of Ultron</text>
        <text x="10" y="158" class="card-genre">Action • Sci-Fi</text>
        <text x="10" y="174" font-size="10" font-weight="600" fill="#38bdf8">92% match</text>
        <text x="10" y="194" font-size="9" fill="#64748b">2015 • Marvel</text>
      </g>

      <!-- Card 3: Iron Man 3 -->
      <g transform="translate(270, 0)">
        <rect width="124" height="205" rx="8" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1" />
        <rect x="6" y="6" width="112" height="115" rx="6" fill="#132329" />
        <circle cx="62" cy="55" r="24" fill="#06b6d4" fill-opacity="0.25" />
        <polygon points="56,43 74,55 56,67" fill="#22d3ee" />
        <rect x="10" y="12" width="48" height="18" rx="9" fill="url(#goldScore)" />
        <text x="34" y="25" text-anchor="middle" class="score-badge">17.9x</text>
        <text x="10" y="142" class="card-title">Iron Man 3</text>
        <text x="10" y="158" class="card-genre">Action • Thriller</text>
        <text x="10" y="174" font-size="10" font-weight="600" fill="#38bdf8">89% match</text>
        <text x="10" y="194" font-size="9" fill="#64748b">2013 • Marvel</text>
      </g>

      <!-- Card 4: Captain America -->
      <g transform="translate(405, 0)">
        <rect width="124" height="205" rx="8" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1" />
        <rect x="6" y="6" width="112" height="115" rx="6" fill="#241a13" />
        <circle cx="62" cy="55" r="24" fill="#f97316" fill-opacity="0.25" />
        <polygon points="56,43 74,55 56,67" fill="#fb923c" />
        <rect x="10" y="12" width="48" height="18" rx="9" fill="url(#goldScore)" />
        <text x="34" y="25" text-anchor="middle" class="score-badge">17.8x</text>
        <text x="10" y="142" class="card-title">First Avenger</text>
        <text x="10" y="158" class="card-genre">Action • War</text>
        <text x="10" y="174" font-size="10" font-weight="600" fill="#38bdf8">88% match</text>
        <text x="10" y="194" font-size="9" fill="#64748b">2011 • Marvel</text>
      </g>
    </g>
  </g>
</svg>
