<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rich Deep Violet & Cinema Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="35%" stop-color="#260f47" />
      <stop offset="70%" stop-color="#1a0a33" />
      <stop offset="100%" stop-color="#0e051a" />
    </linearGradient>

    <!-- Movie Title Coral Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b63" />
      <stop offset="100%" stop-color="#eb4232" />
    </linearGradient>

    <!-- Popcorn Tub Gradient -->
    <linearGradient id="tubRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e52d27" />
      <stop offset="100%" stop-color="#b31217" />
    </linearGradient>

    <!-- Cinema Ticket Gradient -->
    <linearGradient id="ticketTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006266" />
      <stop offset="100%" stop-color="#003538" />
    </linearGradient>

    <!-- Ambient Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .tag-title { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #ffffff; text-transform: uppercase; }
    .hero-movie { font-size: 64px; font-weight: 900; letter-spacing: 2px; fill: url(#coralGrad); }
    .hero-rec { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; fill: #ffffff; }
    .pill-text { font-size: 15px; font-weight: 600; fill: #f1f5f9; letter-spacing: 1px; }
    .ticket-label { font-size: 8px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1020" height="420" rx="14" fill="url(#bgGrad)" stroke="#372054" stroke-width="1.5" />

  <!-- Ambient Bokeh Glow Spheres (Purple/Pink/Gold) -->
  <g opacity="0.35">
    <circle cx="180" cy="180" r="140" fill="#702283" filter="url(#glow)" />
    <circle cx="80" cy="80" r="90" fill="#e52d27" filter="url(#glow)" />
    <circle cx="500" cy="80" r="120" fill="#4a154b" filter="url(#glow)" />
    <circle cx="850" cy="140" r="160" fill="#3b156b" filter="url(#glow)" />
    <circle cx="780" cy="360" r="110" fill="#2c0c4a" filter="url(#glow)" />
  </g>

  <!-- Floating Bokeh Particles -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="80" cy="220" r="2.5" />
    <circle cx="140" cy="90" r="4" opacity="0.4" />
    <circle cx="280" cy="50" r="3" />
    <circle cx="320" cy="180" r="1.5" />
    <circle cx="440" cy="70" r="3.5" opacity="0.3" />
    <circle cx="520" cy="380" r="2.5" />
    <circle cx="720" cy="60" r="4" opacity="0.2" />
    <circle cx="880" cy="80" r="2" />
    <circle cx="950" cy="240" r="3" opacity="0.3" />
    <circle cx="920" cy="380" r="2" />
    <circle cx="620" cy="320" r="1.5" />
  </g>

  <!-- Subtle Network / Constellation Grid (Bottom Right) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="#ffffff" fill-opacity="0.15">
    <line x1="820" y1="360" x2="880" y2="330" />
    <line x1="880" y1="330" x2="940" y2="370" />
    <line x1="940" y1="370" x2="990" y2="320" />
    <line x1="880" y1="330" x2="920" y2="280" />
    <circle cx="820" cy="360" r="3" />
    <circle cx="880" cy="330" r="3" />
    <circle cx="940" cy="370" r="3" />
    <circle cx="990" cy="320" r="3" />
    <circle cx="920" cy="280" r="3" />
  </g>

  <!-- LEFT ILLUSTRATION CLUSTER (Popcorn, Glasses, Film Strip, Tickets, Clapperboard) -->
  <g transform="translate(40, 20)">

    <!-- Curling 35mm Film Strip Ribbon (Loops around tub) -->
    <g filter="url(#softShadow)">
      <!-- Back Strip Loop -->
      <path d="M 60,330 C 120,380 260,370 340,310 C 420,250 430,170 510,180" fill="none" stroke="#232733" stroke-width="32" stroke-linecap="round" />
      <path d="M 60,330 C 120,380 260,370 340,310 C 420,250 430,170 510,180" fill="none" stroke="#ffffff" stroke-width="30" stroke-opacity="0.06" stroke-linecap="round" />
      <path d="M 60,330 C 120,380 260,370 340,310 C 420,250 430,170 510,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.4" />

      <!-- Film Reel Wheel (Bottom Left) -->
      <g transform="translate(110, 310)">
        <circle cx="0" cy="0" r="58" fill="#181c24" stroke="#475569" stroke-width="4" />
        <circle cx="0" cy="0" r="22" fill="#28303f" stroke="#e2e8f0" stroke-width="2" />
        <circle cx="0" cy="0" r="7" fill="#0f172a" />
        <circle cx="0" cy="-38" r="8" fill="#0b0e14" />
        <circle cx="38" cy="0" r="8" fill="#0b0e14" />
        <circle cx="0" cy="38" r="8" fill="#0b0e14" />
        <circle cx="-38" cy="0" r="8" fill="#0b0e14" />
        <circle cx="-27" cy="-27" r="7" fill="#0b0e14" />
        <circle cx="27" cy="-27" r="7" fill="#0b0e14" />
        <circle cx="27" cy="27" r="7" fill="#0b0e14" />
        <circle cx="-27" cy="27" r="7" fill="#0b0e14" />
      </g>
    </g>

    <!-- Clapperboard (Tilted Behind Popcorn) -->
    <g transform="translate(240, 190) rotate(16)" filter="url(#softShadow)">
      <!-- Board Body -->
      <rect x="0" y="24" width="120" height="85" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.5" />
      <!-- HOLLYWOOD / PRODUCTION Text -->
      <text x="60" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#cbd5e1" letter-spacing="2">HOLLYWOOD</text>
      <line x1="12" y1="78" x2="108" y2="78" stroke="#64748b" stroke-width="1.5" />
      <line x1="60" y1="78" x2="60" y2="100" stroke="#64748b" stroke-width="1.5" />
      <!-- Chevrons Stick -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="120" height="22" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <polygon points="12,0 26,0 14,22 0,22" fill="#ffffff" />
        <polygon points="38,0 52,0 40,22 26,22" fill="#ffffff" />
        <polygon points="64,0 78,0 66,22 52,22" fill="#ffffff" />
        <polygon points="90,0 104,0 92,22 78,22" fill="#ffffff" />
      </g>
    </g>

    <!-- Popcorn Tub (Classic Red & White Striped) -->
    <g transform="translate(130, 140)" filter="url(#softShadow)">
      <!-- Tub Base Shape -->
      <polygon points="18,50 142,50 125,200 35,200" fill="#ffffff" />
      <!-- Red Stripes -->
      <polygon points="18,50 36,50 48,200 35,200" fill="url(#tubRed)" />
      <polygon points="54,50 72,50 78,200 64,200" fill="url(#tubRed)" />
      <polygon points="90,50 108,50 108,200 94,200" fill="url(#tubRed)" />
      <polygon points="126,50 142,50 125,200 120,200" fill="url(#tubRed)" />

      <!-- Overflowing Fluffy Popcorn Kernels (Puffy Golden-Yellow) -->
      <g filter="url(#softShadow)">
        <circle cx="28" cy="42" r="17" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />
        <circle cx="50" cy="30" r="20" fill="#fffbeb" stroke="#facc15" stroke-width="1.5" />
        <circle cx="80" cy="26" r="22" fill="#ffffff" stroke="#fde047" stroke-width="1.5" />
        <circle cx="112" cy="34" r="19" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />
        <circle cx="132" cy="48" r="16" fill="#fffbeb" stroke="#facc15" stroke-width="1.5" />

        <!-- Second Layer Kernels -->
        <circle cx="40" cy="14" r="17" fill="#ffffff" stroke="#fde047" stroke-width="1.5" />
        <circle cx="68" cy="8" r="19" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />
        <circle cx="98" cy="14" r="18" fill="#fffbeb" stroke="#fde047" stroke-width="1.5" />

        <!-- Top Peak Kernels -->
        <circle cx="55" cy="-6" r="15" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />
        <circle cx="82" cy="-10" r="16" fill="#ffffff" stroke="#fde047" stroke-width="1.5" />
        <circle cx="102" cy="-4" r="13" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />
      </g>
    </g>

    <!-- Flying Popcorn Pieces in Air -->
    <circle cx="100" cy="80" r="9" fill="#fef08a" stroke="#facc15" stroke-width="1.2" />
    <circle cx="260" cy="110" r="8" fill="#fffbeb" stroke="#fde047" stroke-width="1.2" />
    <circle cx="270" cy="65" r="7" fill="#fef08a" stroke="#facc15" stroke-width="1.2" />

    <!-- 3D Cinema Glasses (Hanging / Angled on Front of Tub) -->
    <g transform="translate(205, 110) rotate(14)" filter="url(#softShadow)">
      <!-- Frame Structure -->
      <polygon points="0,0 80,0 72,50 8,50" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Left Red Lens -->
      <polygon points="8,8 36,8 32,42 12,42" fill="#ef4444" fill-opacity="0.9" />
      <!-- Right Cyan Lens -->
      <polygon points="44,8 72,8 68,42 48,42" fill="#06b6d4" fill-opacity="0.9" />
      <!-- Glasses Temple Arms (Extending Out) -->
      <line x1="0" y1="8" x2="-45" y2="28" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      <line x1="80" y1="8" x2="115" y2="40" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Cinema Admission Tickets (Front Left) -->
    <!-- Ticket 1 (Teal Green) -->
    <g transform="translate(45, 185) rotate(-22)" filter="url(#softShadow)">
      <rect width="90" height="48" rx="4" fill="url(#ticketTeal)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />
      <!-- Perforated Stub Notch -->
      <circle cx="0" cy="24" r="6" fill="#140826" />
      <circle cx="90" cy="24" r="6" fill="#140826" />
      <line x1="26" y1="0" x2="26" y2="48" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6" />
      <text x="58" y="22" text-anchor="middle" class="font-base ticket-label">CINEMA</text>
      <text x="58" y="34" text-anchor="middle" class="font-base ticket-label" fill="#a7f3d0">TICKET</text>
    </g>

    <!-- Ticket 2 (Blue-Black Overlay) -->
    <g transform="translate(100, 245) rotate(18)" filter="url(#softShadow)">
      <rect width="95" height="50" rx="4" fill="#0b1b36" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="0" cy="25" r="6" fill="#140826" />
      <circle cx="95" cy="25" r="6" fill="#140826" />
      <line x1="28" y1="0" x2="28" y2="50" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.7" />
      <text x="62" y="24" text-anchor="middle" class="font-base ticket-label" fill="#ffffff">CINEMA</text>
      <text x="62" y="36" text-anchor="middle" class="font-base ticket-label" fill="#38bdf8">ADMIT ONE</text>
    </g>

    <!-- Foreground Film Strip Curling to Front -->
    <path d="M 90,360 C 180,380 270,330 350,290 C 410,260 480,260 540,290" fill="none" stroke="#000000" stroke-width="24" stroke-opacity="0.5" />
    <path d="M 90,360 C 180,380 270,330 350,290 C 410,260 480,260 540,290" fill="none" stroke="#1e2430" stroke-width="20" stroke-linecap="round" />
    <path d="M 90,360 C 180,380 270,330 350,290 C 410,260 480,260 540,290" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 5" stroke-opacity="0.5" />
  </g>

  <!-- RIGHT COLUMN: Clean, Bold, Human-Made Typography & Showcase Tag -->
  <g transform="translate(510, 110)" class="font-base">

    <!-- Top Tag / Pill Box -->
    <g>
      <rect x="0" y="0" width="370" height="34" rx="4" fill="#000000" fill-opacity="0.38" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <text x="22" y="23" class="tag-title">MACHINE LEARNING PROJECT</text>
    </g>

    <!-- Main Title Heading -->
    <g transform="translate(0, 85)" filter="url(#textShadow)">
      <!-- MOVIE (Vibrant Coral/Orange) -->
      <text x="0" y="0" class="hero-movie">MOVIE</text>
      <!-- Recommendation System (Clean White) -->
      <text x="0" y="52" class="hero-rec">Recommendation</text>
      <text x="0" y="100" class="hero-rec">System</text>
    </g>

    <!-- Bottom Outline Box / Tag (Simple & Decent, No Clutter) -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="310" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <text x="155" y="25" text-anchor="middle" class="pill-text">Interactive System in Python</text>
    </g>
  </g>
</svg>
